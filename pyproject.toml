[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orharness"
version = "0.1.0"
description = "LLM-powered agentic harness for Google OR-Tools"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
  {name = "Valentina Halasi", email = "mail@valentinahalasi.com"}
]
dependencies = [
  "ortools>=9.10",
  "litellm>=1.40",
  "pydantic>=2.0",
  "anthropic>=0.30",
  "mcp>=1.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "black",
  "ruff",
  "build",
  "twine"
]
